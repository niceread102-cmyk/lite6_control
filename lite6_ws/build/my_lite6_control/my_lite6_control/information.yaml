robot:
  name: UF_ROBOT
  type: lite6
  dof: 6

# ─── Kinematic Chain ────────────────────────────────────────────────────────
# world → link_base → link1 → link2 → link3 → link4 → link5 → link6
#       → link_eef → uflite_gripper_link → link_tcp
#                  → camera_link → camera_depth_frame / color / ir frames

# ─── Links ──────────────────────────────────────────────────────────────────
links:
  world:
    description: Fixed world frame (origin)

  link_base:
    mass: 1.65394
    com: [-0.00830, 0.0000326, 0.06312]   # Center of mass [m]
    inertia: {ixx: 0.0, ixy: 0.0, ixz: 0.0, iyy: 0.0, iyz: 0.0, izz: 0.0}
    mesh_visual:    "package://xarm_description/meshes/lite6/visual/link_base.stl"
    mesh_collision: "package://xarm_description/meshes/lite6/collision/link_base.stl"

  link1:
    mass: 1.411
    com: [-0.00036, 0.04195, -0.0025]
    inertia: {ixx: 0.00145164, ixy: -1.24e-5, ixz: 6.7e-6, iyy: 8.873e-4, iyz: -1.255e-4, izz: 0.00131993}
    mesh_visual:    "package://xarm_description/meshes/lite6/visual/link1.stl"
    mesh_collision: "package://xarm_description/meshes/lite6/collision/link1.stl"

  link2:
    mass: 1.34
    com: [0.179, 0.0, 0.0584]
    inertia: {ixx: 0.0015854, ixy: 6.766e-6, ixz: 0.00115136, iyy: 0.0056097, iyz: -1.14e-6, izz: 0.00485}
    mesh_visual:    "package://xarm_description/meshes/lite6/visual/link2.stl"
    mesh_collision: "package://xarm_description/meshes/lite6/collision/link2.stl"

  link3:
    mass: 0.953
    com: [0.072, -0.0357, -0.001]
    inertia: {ixx: 8.861e-4, ixy: 3.9287e-4, ixz: -7.066e-5, iyy: 1.5785e-3, iyz: 2.445e-5, izz: 1.84677e-3}
    mesh_visual:    "package://xarm_description/meshes/lite6/visual/link3.stl"
    mesh_collision: "package://xarm_description/meshes/lite6/collision/link3.stl"

  link4:
    mass: 1.284
    com: [-0.002, -0.0285, -0.0813]
    inertia: {ixx: 3.705e-3, ixy: 2e-6, ixz: -7.17e-6, iyy: 3.0455e-3, iyz: 9.3188e-4, izz: 1.5413e-3}
    mesh_visual:    "package://xarm_description/meshes/lite6/visual/link4.stl"
    mesh_collision: "package://xarm_description/meshes/lite6/collision/link4.stl"

  link5:
    mass: 0.804
    com: [0.0, 0.01, 0.0019]
    inertia: {ixx: 5.668e-4, ixy: -6e-7, ixz: 5.3e-6, iyy: 5.077e-4, iyz: 4.8e-7, izz: 5.3e-4}
    mesh_visual:    "package://xarm_description/meshes/lite6/visual/link5.stl"
    mesh_collision: "package://xarm_description/meshes/lite6/collision/link5.stl"

  link6:
    mass: 0.13
    com: [0.0, -0.00194, -0.0102]
    inertia: {ixx: 7.726e-5, ixy: -1e-6, ixz: -4e-7, iyy: 8.5665e-5, iyz: 6e-7, izz: 1.4814e-4}
    mesh_visual:    "package://xarm_description/meshes/lite6/visual/link6.stl"
    mesh_collision: "package://xarm_description/meshes/lite6/collision/link6.stl"

  link_eef:
    description: End-effector frame (camera mount + gripper base)
    mesh_visual:    "package://xarm_description/meshes/camera/realsense/visual/d435_with_cam_stand.stl"
    mesh_collision: "package://xarm_description/meshes/camera/realsense/collision/d435_with_cam_stand.stl"
    mesh_rpy: [0.0, 0.0, 3.14159265]   # π rotation around Z

  uflite_gripper_link:
    mass: 0.25
    com: [0.0, 0.0, 0.030]
    inertia: {ixx: 4.7106e-4, ixy: 3.9292e-7, ixz: 2.6537e-6, iyy: 3.3072e-4, iyz: -1.0975e-5, izz: 2.5642e-4}
    mesh_visual:    "package://xarm_description/meshes/gripper/lite/visual/shell.stl"

  uflite_finger1:
    mass: 0.0163
    com: [0.0, 0.01, 0.0086]
    inertia: {ixx: 1.425e-6, ixy: 0.0, ixz: 0.0, iyy: 1.63e-6, iyz: -3.1e-7, izz: 8.63e-7}
    mesh_visual: "package://xarm_description/meshes/gripper/lite/visual/finger1.stl"

  uflite_finger2:
    mass: 0.0163
    com: [0.0, -0.01, 0.0086]
    inertia: {ixx: 1.425e-6, ixy: 0.0, ixz: 0.0, iyy: 1.63e-6, iyz: 3.1e-7, izz: 8.63e-7}
    mesh_visual: "package://xarm_description/meshes/gripper/lite/visual/finger2.stl"

  link_tcp:
    description: Tool Center Point (gripper tip)

  # Camera frames
  camera_link:             {description: "RealSense D435 camera optical center"}
  camera_depth_frame:      {description: "Depth sensor frame"}
  camera_depth_optical_frame: {description: "Depth optical frame (Z forward)"}
  camera_color_frame:      {description: "Color sensor frame"}
  camera_color_optical_frame: {description: "Color optical frame (Z forward)"}
  camera_left_ir_frame:    {description: "Left IR sensor frame"}
  camera_left_ir_optical_frame:  {description: "Left IR optical frame"}
  camera_right_ir_frame:   {description: "Right IR sensor frame"}
  camera_right_ir_optical_frame: {description: "Right IR optical frame"}

# ─── Joints ─────────────────────────────────────────────────────────────────
joints:
  world_joint:
    type: fixed
    parent: world
    child:  link_base
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

  joint1:
    type: revolute
    parent: link_base
    child:  link1
    xyz: [0.0, 0.0, 0.2435]
    rpy: [0.0, 0.0, 0.0]
    axis: [0, 0, 1]
    limit:
      lower:    -6.28318530718   # -2π [rad]
      upper:     6.28318530718   #  2π [rad]
      velocity:  3.14            # [rad/s]
      effort:   50.0             # [N·m]
    dynamics: {damping: 1.0, friction: 1.0}

  joint2:
    type: revolute
    parent: link1
    child:  link2
    xyz: [0.0, 0.0, 0.0]
    rpy: [1.5708, -1.5708, 3.1416]
    axis: [0, 0, 1]
    limit:
      lower:   -2.61799
      upper:    2.61799
      velocity: 3.14
      effort:  50.0
    dynamics: {damping: 1.0, friction: 1.0}

  joint3:
    type: revolute
    parent: link2
    child:  link3
    xyz: [0.2002, 0.0, 0.0]
    rpy: [-3.1416, 0.0, 1.5708]
    axis: [0, 0, 1]
    limit:
      lower:   -0.061087
      upper:    5.235988
      velocity: 3.14
      effort:  32.0
    dynamics: {damping: 1.0, friction: 1.0}

  joint4:
    type: revolute
    parent: link3
    child:  link4
    xyz: [0.087, -0.22761, 0.0]
    rpy: [1.5708, 0.0, 0.0]
    axis: [0, 0, 1]
    limit:
      lower:   -6.28318530718
      upper:    6.28318530718
      velocity: 3.14
      effort:  32.0
    dynamics: {damping: 1.0, friction: 1.0}

  joint5:
    type: revolute
    parent: link4
    child:  link5
    xyz: [0.0, 0.0, 0.0]
    rpy: [1.5708, 0.0, 0.0]
    axis: [0, 0, 1]
    limit:
      lower:   -2.1642
      upper:    2.1642
      velocity: 3.14
      effort:  32.0
    dynamics: {damping: 1.0, friction: 1.0}

  joint6:
    type: revolute
    parent: link5
    child:  link6
    xyz: [0.0, 0.0625, 0.0]
    rpy: [-1.5708, 0.0, 0.0]
    axis: [0, 0, 1]
    limit:
      lower:   -6.28318530718
      upper:    6.28318530718
      velocity: 3.14
      effort:  20.0
    dynamics: {damping: 1.0, friction: 1.0}

  joint_eef:
    type: fixed
    parent: link6
    child:  link_eef
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

  # Gripper joints
  gripper_fix:
    type: fixed
    parent: link_eef
    child:  uflite_gripper_link
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

  finger_joint1:
    type: prismatic
    parent: uflite_gripper_link
    child:  uflite_finger1
    xyz: [0.0, 0.0, 0.0543]
    rpy: [0.0, 0.0, 0.0]
    axis: [0, 1, 0]
    limit:
      lower:    0.0
      upper:    0.0089    # [m]
      velocity: 2.0       # [m/s]
      effort:   5.0       # [N]

  finger_joint2:
    type: prismatic
    parent: uflite_gripper_link
    child:  uflite_finger2
    xyz: [0.0, 0.0, 0.0543]
    rpy: [0.0, 0.0, 0.0]
    axis: [0, -1, 0]
    limit:
      lower:    0.0
      upper:    0.0089
      velocity: 2.0
      effort:   5.0
    mimic:
      joint:      finger_joint1
      multiplier: 1.0
      offset:     0.0

  joint_tcp:
    type: fixed
    parent: uflite_gripper_link
    child:  link_tcp
    xyz: [0.0, 0.0, 0.0836]
    rpy: [0.0, 0.0, 0.0]

  # Camera joints
  camera_link_joint:
    type: fixed
    parent: link_eef
    child:  camera_link
    xyz: [0.06746, -0.0175, 0.0237]
    rpy: [3.14159265, -1.5707963, 0.0]

  camera_depth_joint:
    type: fixed
    parent: camera_link
    child:  camera_depth_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

  camera_depth_optical_joint:
    type: fixed
    parent: camera_depth_frame
    child:  camera_depth_optical_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [-1.5707963, 0.0, -1.5707963]

  camera_color_joint:
    type: fixed
    parent: camera_link
    child:  camera_color_frame
    xyz: [0.0, 0.015, 0.0]
    rpy: [0.0, 0.0, 0.0]

  camera_color_optical_joint:
    type: fixed
    parent: camera_color_frame
    child:  camera_color_optical_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [-1.5707963, 0.0, -1.5707963]

  camera_left_ir_joint:
    type: fixed
    parent: camera_link
    child:  camera_left_ir_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

  camera_left_ir_optical_joint:
    type: fixed
    parent: camera_left_ir_frame
    child:  camera_left_ir_optical_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [-1.5707963, 0.0, -1.5707963]

  camera_right_ir_joint:
    type: fixed
    parent: camera_link
    child:  camera_right_ir_frame
    xyz: [0.0, -0.050, 0.0]
    rpy: [0.0, 0.0, 0.0]

  camera_right_ir_optical_joint:
    type: fixed
    parent: camera_right_ir_frame
    child:  camera_right_ir_optical_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [-1.5707963, 0.0, -1.5707963]
