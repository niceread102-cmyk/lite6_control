# Lite6 robot logic + motion-test sim. Read by moveit2, moveit2_action, moveit2_test, sequence_sim_action,
# sequence_sim_action_fix, auto_pick_loop_sim and sim/lite6_motion_sim.py; sequence_real_action reads
# config/real.yaml, which includes this file. Override any leaf on the command line (after the executable):
#   ros2 run my_lite6_control moveit2 planning.planner_id=RRTstar robot.joint_limits.joint5.position_deg=[-90,90]
#   ros2 run my_lite6_control sequence_sim_action_fix --config ~/my.yaml sequence.approach_dist_m=0.06
#   ros2 run my_lite6_control moveit2 --print-config          (prints the merged config)
#   lab sim/lite6_motion_sim.py sim.render.mode=RealTimePathTracing
# Merge order (later wins): files in `defaults:` -> this file -> command line.
# The nodes read this file from src/ when they find the workspace source, so edits need no colcon build.
defaults: [robots/lite6]        # robot preset: joint names, joint limits, named poses, gripper

planning:                       # every planned move: TCP pose -> compute_ik (seeded with /joint_states) -> joint goal -> plan
  planner_id: RRTConnect        # OMPL planner (xarm_moveit_config/config/lite6/ompl_planning.yaml: RRTConnect, RRTstar, PRM, ...)
  pipeline_id: ''               # '' = move_group's default planning pipeline (ompl)
  planning_time_s: 5.0          # allowed_planning_time
  planning_attempts: 10         # num_planning_attempts
  velocity_scaling: 0.15        # x MoveIt's joint velocity limits - single-target nodes (moveit2, moveit2_action,
  acceleration_scaling: 0.05    # moveit2_test); the pick sequence has its own under `sequence`
  goal_joint_tolerance_rad: 0.0005  # joint goal = IK solution +- this; tight = the plan lands on the same spot every time
  enforce_joint_limits: true    # robot.joint_limits: IK solutions and every planned state must stay inside (IK and path
                                # constraints), trajectories are checked and slowed to the velocity/acceleration limits,
                                # fixed moves lengthened. false = only MoveIt's own (URDF) limits
  ik:
    timeout_s: 1.0              # compute_ik timeout
    avoid_collisions: true

safety:                         # sequence nodes reject a /target_pose (TCP in link_base) outside this box or reach.
  workspace_x_m: [0.05, 0.45]   # The box is also sent as MotionPlanRequest.workspace_parameters (MoveIt applies that
  workspace_y_m: [-0.45, 0.45]  # to floating/planar joints only - it does not bound the arm's path)
  workspace_z_m: [0.01, 0.60]
  max_reach_m: 0.44             # |TCP position| from the base origin

moveit2:                        # single-target nodes: /target_pose -> IK -> plan -> execute -> /ik_done
  dedup_pos_m: 0.001            # moveit2: a target this close to the last completed one is skipped (no IK/plan/execute);
  dedup_angle_deg: 0.5          # re-solving IK from the live joint state gives a slightly different solution = TCP twitch
  exec_margin_s: 0.5            # moveit2_test: /ik_done this long after the published trajectory's end

sequence:                       # pick-and-place state machine (sequence_sim_action(_fix), sequence_real_action, auto_pick_loop_sim)
  velocity_scaling: 0.06        # planned moves of the pick cycle (pre-grasp, dive, lift)
  acceleration_scaling: 0.02
  approach_dist_m: 0.04         # pre-grasp = grasp pose backed off this far along the tool z axis
  descend_dist_m: 0.04          # dive from pre-grasp along the tool z axis (= approach_dist_m: down to the grasp pose)
  move_time_s:                  # fixed joint moves to robot.poses (lengthened if a joint would exceed its max velocity)
    home: 4.0
    init: 4.0
    goal_mid: 4.0
    goal: 5.0
  start_delay_s: 0.5            # node start -> first move to home
  grasp_delay_s: 0.3            # arrived at the grasp pose -> close the gripper
  grasp_hold_s: 1.5             # gripper closed -> lift (sim; the real gripper call waits robot.gripper.service_wait_s)
  drop_wait_s: 1.5              # gripper opened at the goal -> return home
  arrival:                      # sequence_sim_action_fix: a move is done once every joint in /joint_states is within
    threshold_rad: 0.015        # this of the target (not by the controller's goal timing) ...
    settle_s: 0.5               # ... plus this wait
    timeout_s: 30.0             # not arrived by then = failed move

ros:
  target_pose_topic: /target_pose
  joint_states_topic: /joint_states
  done_topic: /ik_done          # Bool after every target (moveit2, moveit2_action, moveit2_test)
  compute_ik_service: /compute_ik
  move_group_action: /move_action
  trajectory_action: /lite6_traj_controller/follow_joint_trajectory
  trajectory_topic: /lite6_traj_controller/joint_trajectory  # moveit2_test publishes here instead
  gripper_command_topic: /gripper/command                     # Float32 finger opening (m) for the sim gripper
  sim_mirror_action: null       # sequence_sim_action_fix: also send every trajectory to this FollowJointTrajectory action
                                # (e.g. /robot_bridge/follow_joint_trajectory). null = off: sim/lite6_motion_sim.py follows
                                # /joint_states, and waiting for a server that is not there cost sim_mirror_timeout_s per move
  sim_mirror_timeout_s: 0.5
  wait_timeout_s: 3.0           # wait for compute_ik / move_group / trajectory action servers

sim:                            # sim/lite6_motion_sim.py: the Lite6 alone (no bin map, no cameras) for watching its motion
  experience: ~/IsaacSim/_build/linux-aarch64/release/apps/isaacsim.exp.base.kit  # Base kit: far fewer extensions than Full
  headless: false
  robot_usd: ~/IsaacSim/assets/uf_lite6.usd
  robot_prim: /World/lite6
  map_usd: null                 # null = minimal stage built by the script (floor + 2 lights + robot); or a USD map to open
                                # around the robot (heavier; its own lights / physics scene are kept)
  ground: true                  # visual floor, no collider (the robot base is fixed, nothing needs to collide)
  initial_pose: home            # robot.poses name or 6 values (rad); held until the first /joint_states arrives
  physics_hz: 120               # PhysX steps per second; keep it a multiple of render.fps_limit so every frame gets the
                                # same number of steps (otherwise the motion stutters)
  physics_gpu: false            # false = CPU PhysX (faster for one articulation)
  apply_joint_limits: true      # write robot.joint_limits into the USD joints; /joint_states outside them are clamped (+ warning)
  drive:                        # arm joint position drives (PD); USD units: stiffness N*m/deg, damping N*m*s/deg
    stiffness: 1600.0
    damping: 80.0
    max_force: 3400.0
    velocity_feedforward: true  # also track the /joint_states velocities (without: the arm trails by ~damping/stiffness = 0.05 s)
  gripper_drive: {stiffness: 1.0e6, damping: 1.0e4, max_force: 5.0}
  render:
    mode: MinimalRendering      # RTX renderer: MinimalRendering ("RTX - Minimal", fastest) | RealTimePathTracing (Kit
                                # default "RTX - Real-Time 2.0") | PathTracing; also switchable in the viewport render menu
    fps_limit: 60               # cap the app loop (0 = uncapped: the GPU renders as fast as it can)
    extra_settings: {}          # other carb settings to apply after start, e.g. {/rtx/post/dlss/execMode: 0}
  lights:
    dome_intensity: 1000.0      # 0 = off
    distant_intensity: 2500.0
  camera:                       # initial viewport camera
    eye_m: [1.1, 1.1, 0.8]
    target_m: [0.0, 0.0, 0.25]
  log_every_s: 10.0             # print fps and the /joint_states rate every this many seconds (0 = off)
