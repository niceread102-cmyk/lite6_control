# UFACTORY Lite6 + Lite6 gripper. Included by config/default.yaml (`defaults:`).
# robot.joint_limits are what the robot logic enforces (IK solutions, planned paths, fixed joint moves - see
# planning.enforce_joint_limits) and, with sim.apply_joint_limits, the joint limits of the Isaac Sim robot.
# They can only narrow what MoveIt already allows (lite6 URDF / datasheet: J1 J4 J6 +-360, J2 +-150,
# J3 -3.5..300, J5 +-124 deg).
robot:
  name: lite6
  group: lite6                  # MoveIt planning group
  base_frame: link_base         # frame of /target_pose and of the safety box
  eef_link: link_eef            # IK link (flange)
  tcp_offset_m: 0.0836          # TCP = eef_link + this along its z axis (between the gripper fingers)
  joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
  joint_limits:                 # position_deg: [min, max]
                                # max_velocity_deg_s / max_acceleration_deg_s2: null = MoveIt's joint_limits.yaml
                                # (2.14 rad/s = 122.6 deg/s, 10 rad/s^2 = 573 deg/s^2) x the velocity/acceleration
                                # scaling; a number caps that joint (planned trajectories are slowed down, fixed
                                # moves lengthened, and the sim joint gets it as its max velocity)
    joint1: {position_deg: [-360, 360], max_velocity_deg_s: null, max_acceleration_deg_s2: null}
    joint2: {position_deg: [-150, 150], max_velocity_deg_s: null, max_acceleration_deg_s2: null}
    joint3: {position_deg: [-3.5, 300], max_velocity_deg_s: null, max_acceleration_deg_s2: null}
    joint4: {position_deg: [-360, 360], max_velocity_deg_s: null, max_acceleration_deg_s2: null}
    joint5: {position_deg: [-124, 124], max_velocity_deg_s: null, max_acceleration_deg_s2: null}
    joint6: {position_deg: [-360, 360], max_velocity_deg_s: null, max_acceleration_deg_s2: null}
  poses:                        # named joint poses, rad (numbers or expressions with pi); must lie inside the limits
    home:     [1.0, 0.0, pi/2, 0.0, pi/2, 1.0]
    init:     [0.0, 0.0, pi/2, 0.0, pi/2, 0.0]
    goal_mid: [-1.57, 0.0, 1.57, 0.0, 1.57, -1.57]   # sequence_sim_action(_fix): via point on the way to goal
    goal:     [-1.57, 1.3, 2.87, 0.0, 1.57, -1.57]   # drop pose (config/real.yaml has the real cell's)
  gripper:
    joint_names: [finger_joint1, finger_joint2]    # sim gripper joints (prismatic)
    open_m: 0.0089              # finger opening sent on /gripper/command (sim)
    close_m: 0.0
    open_service: /ufactory/open_lite6_gripper     # real robot (sequence_real_action): xarm_msgs/srv/Call
    close_service: /ufactory/close_lite6_gripper
    service_setup: ~/xarm_ros2/install/setup.bash  # sourced before `ros2 service call`
    service_wait_s: 1.5         # wait after each gripper service call
